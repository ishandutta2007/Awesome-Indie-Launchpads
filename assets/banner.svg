<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="45%" stop-color="#0f172a"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="35%" stop-color="#a855f7"/><stop offset="70%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".45" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.2" fill="#334155" opacity=".4"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="35"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.32;transform:scale(1)}50%{opacity:.55;transform:scale(1.1)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-18px) translateX(12px);opacity:.75}}@keyframes launchPulse{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.05)}}@keyframes borderShift{0%{stroke-opacity:.45}50%{stroke-opacity:.9}}@keyframes beamFlow{0%{stroke-dashoffset:280}}@keyframes badgeBob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}.ambient-orb1{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:250px 180px}.ambient-orb2{animation:pulseGlow 10s ease-in-out infinite alternate-reverse;transform-origin:950px 220px}.particle-1{animation:floatParticle 5s ease-in-out infinite}.particle-2{animation:floatParticle 7s ease-in-out infinite 1.5s}.particle-3{animation:floatParticle 6s ease-in-out infinite .7s}.particle-4{animation:floatParticle 8s ease-in-out infinite 2.2s}.rocket-icon{animation:launchPulse 3.5s ease-in-out infinite;transform-origin:600px 75px}.inner-border{animation:borderShift 4s ease-in-out infinite}.flow-line{stroke-dasharray:20,15;animation:beamFlow 5s linear infinite}.badge-float{animation:badgeBob 4s ease-in-out infinite}.badge-float-delayed{animation:badgeBob 4s ease-in-out infinite 2s}.text-sub,.text-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.text-title{font-weight:900;font-size:52px;letter-spacing:-1.2px}.text-sub{font-weight:500;font-size:20px;letter-spacing:.5px;fill:#94a3b8}.badge-text,.text-tag{font-weight:600;font-size:13px}.text-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,&quot;Courier New&quot;,monospace;letter-spacing:1.2px}.badge-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}</style><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".6"><circle cx="220" cy="180" r="160" fill="#a855f7" class="ambient-orb1" filter="url(#softGlow)"/><circle cx="980" cy="240" r="170" fill="#38bdf8" class="ambient-orb2" filter="url(#softGlow)"/><circle cx="600" cy="80" r="130" fill="#f43f5e" class="ambient-orb1" filter="url(#softGlow)" opacity=".3"/></g><g fill="none" opacity=".45"><path stroke="url(#primaryGrad)" stroke-width="1.5" d="M 60 80 Q 300 20, 600 80 T 1140 80" class="flow-line"/><path stroke="url(#primaryGrad)" stroke-width="1.5" d="M 80 340 Q 400 390, 600 340 T 1120 340" class="flow-line"/></g><g fill="#93c5fd"><circle cx="160" cy="120" r="2.5" class="particle-1"/><circle cx="290" cy="290" r="2" class="particle-2"/><circle cx="930" cy="110" r="3" fill="#c084fc" class="particle-3"/><circle cx="1040" cy="310" r="2.2" fill="#f472b6" class="particle-4"/><circle cx="440" cy="65" r="1.8" class="particle-2"/><circle cx="760" cy="65" r="2" fill="#38bdf8" class="particle-1"/></g><rect width="1176" height="396" x="12" y="12" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" class="inner-border" rx="12"/><g transform="translate(600, 52)"><rect width="280" height="28" x="-140" y="-14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity=".9" rx="14"/><text y="5" fill="#a5b4fc" class="text-tag" text-anchor="middle">THE INDIE MAKER DIRECTORY</text></g><g class="rocket-icon" transform="translate(600, 95)"><circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/><text dominant-baseline="central" font-size="22" text-anchor="middle">🚀</text></g><text x="600" y="180" fill="#030712" class="text-title" dy="2" opacity=".65" text-anchor="middle">Awesome Indie Launchpads</text><text x="600" y="180" fill="url(#textGrad)" class="text-title" filter="url(#glow)" text-anchor="middle">Awesome Indie Launchpads</text><text x="600" y="222" class="text-sub" text-anchor="middle">Curated Launch Platforms, Startup Directories, &amp; Open-Source Clones</text><text x="600" y="254" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" text-anchor="middle">Gain High-DA Backlinks <tspan fill="#64748b">•</tspan> Spark Early Revenue <tspan fill="#64748b">•</tspan> Drive Organic Traffic <tspan fill="#64748b">•</tspan> Build in Public</text><g class="badge-float" transform="translate(190, 310)"><rect width="185" height="36" x="-10" y="-16" fill="#111827" stroke="#3b82f6" stroke-width="1.2" opacit