<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card/Border Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.2" fill="#334155" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.32; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.75; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes launchPulse {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
    }
    @keyframes borderShift {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 280; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .ambient-orb1 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 250px 180px;
    }
    .ambient-orb2 {
      animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
      transform-origin: 950px 220px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 0.7s; }
    .particle-4 { animation: floatParticle 8s ease-in-out infinite 2.2s; }
    .rocket-icon {
      animation: launchPulse 3.5s ease-in-out infinite;
      transform-origin: 600px 75px;
    }
    .inner-border {
      animation: borderShift 4s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 20, 15;
      animation: beamFlow 5s linear infinite;
    }
    .badge-float {
      animation: badgeBob 4s ease-in-out infinite;
    }
    .badge-float-delayed {
      animation: badgeBob 4s ease-in-out infinite 2s;
    }

    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -1.2px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .text-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Background Decorative Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Background Orbs (Behind Foreground) -->
  <g opacity="0.6">
    <circle class="ambient-orb1" cx="220" cy="180" r="160" fill="#a855f7" filter="url(#softGlow)" />
    <circle class="ambient-orb2" cx="980" cy="240" r="170" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="ambient-orb1" cx="600" cy="80" r="130" fill="#f43f5e" filter="url(#softGlow)" opacity="0.3" />
  </g>

  <!-- Flowing Dynamic Light Tracks in Background -->
  <g fill="none" opacity="0.45">
    <path class="flow-line" d="M 60 80 Q 300 20, 600 80 T 1140 80" stroke="url(#primaryGrad)" stroke-width="1.5" />
    <path class="flow-line" d="M 80 340 Q 400 390, 600 340 T 1120 340" stroke="url(#primaryGrad)" stroke-width="1.5" />
  </g>

  <!-- Subtle Floating Particles in Canvas Background -->
  <g fill="#93c5fd">
    <circle class="particle-1" cx="160" cy="120" r="2.5" />
    <circle class="particle-2" cx="290" cy="290" r="2" />
    <circle class="particle-3" cx="930" cy="110" r="3" fill="#c084fc" />
    <circle class="particle-4" cx="1040" cy="310" r="2.2" fill="#f472b6" />
    <circle class="particle-2" cx="440" cy="65" r="1.8" />
    <circle class="particle-1" cx="760" cy="65" r="2" fill="#38bdf8" />
  </g>

  <!-- Outer Card Frame with Dynamic Accent Border -->
  <rect class="inner-border" x="12" y="12" width="1176" height="396" rx="12" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" />

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Category Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <text class="text-tag" text-anchor="middle" y="5" fill="#a5b4fc">THE INDIE MAKER DIRECTORY</text>
  </g>

  <!-- Animated Rocket Anchor Icon in Foreground -->
  <g class="rocket-icon" transform="translate(600, 95)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text font-size="22" text-anchor="middle" dominant-baseline="central">🚀</text>
  </g>

  <!-- Primary Foreground Title -->
  <!-- Subtle dark drop shadow backing guarantees high contrast & legibility -->
  <text class="text-title" x="600" y="180" text-anchor="middle" fill="#030712" opacity="0.65" dy="2">Awesome Indie Launchpads</text>
  <text class="text-title" x="600" y="180" text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)">Awesome Indie Launchpads</text>

  <!-- Subtitle in Foreground -->
  <text class="text-sub" x="600" y="222" text-anchor="middle">
    Curated Launch Platforms, Startup Directories, &amp; Open-Source Clones
  </text>

  <!-- Tagline / Value Proposition in Foreground -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e1" x="600" y="254" text-anchor="middle">
    Gain High-DA Backlinks <tspan fill="#64748b">•</tspan> Spark Early Revenue <tspan fill="#64748b">•</tspan> Drive Organic Traffic <tspan fill="#64748b">•</tspan> Build in Public
  </text>

  <!-- Foreground Feature Badges / Pills -->
  <g class="badge-float" transform="translate(190, 310)">
    <rect x="-10" y="-16" width="185" height="36" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
    <text class="badge-text" x="82" y="6" text-anchor="middle" fill="#93c5fd">✨ 12+ SaaS Launchpads</text>
  </g>

  <g class="badge-float-delayed" transform="translate(405, 310)">
    <rect x="-10" y="-16" width="195" height="36" rx="18" fill="#111827" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
    <text class="badge-text" x="87" y="6" text-anchor="middle" fill="#c4b5fd">🏗️ Open-Source Clones</text>
  </g>

  <g class="badge-float" transform="translate(630, 310)">
    <rect x="-10" y="-16" width="175" height="36" rx="18" fill="#111827" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <text class="badge-text" x="77" y="6" text-anchor="middle" fill="#6ee7b7">💰 Pricing &amp; Scale Data</text>
  </g>

  <g class="badge-float-delayed" transform="translate(835, 310)">
    <rect x="-10" y="-16" width="175" height="36" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="1.2" opacity="0.95" />
    <text class="badge-text" x="77" y="6" text-anchor="middle" fill="url(#goldGrad)">🛠️ Launch Checklist</text>
  </g>

  <!-- Bottom Mini Footer in Banner -->
  <g transform="translate(600, 385)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
      LAUNCH <tspan fill="#3b82f6">•</tspan> SHOWCASE <tspan fill="#a855f7">•</tspan> SCALE YOUR STARTUP
    </text>
  </g>
</svg>
